[package]
name = "mymeta"
version = "1.0.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "MyMeta"
path = "src/main.rs"

[dependencies]
# MyQuery query core (connections, TLS, metadata queries); no desktop GUI.
sql-desk = { path = "../MyQuery", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
axum = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
sqlparser = { version = "0.64", features = ["visitor"] }
regex = "1"
rust_xlsxwriter = "0.92"
calamine = "0.32"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
